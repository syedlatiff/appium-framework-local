name: iOS UI Tests (Appium + Simulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IOS_SUITE_XML: "testNGSuite/testng_iOS.xml"                 # iOS-only TestNG suite
      APPIUM_URL: "http://127.0.0.1:4723/"
      IOS_APP_PATH: "src/test/java/org/latiffsyed/resources/UIKitCatalog.app"
      IOS_TARGET_VERSION: "17.2"                                   # target iOS; falls back to newest available
      IOS_TARGET_DEVICE: "iPhone 15 Pro"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Appium + XCUITest driver
        run: |
          set -e
          npm config set fund false
          npm config set audit false
          npm i -g appium@latest
          appium driver install xcuitest
          appium -v
        shell: bash

      # ---- FIXED: Python calls xcrun directly (no stdin), picks/creates exact simulator ----
      - name: Resolve simulator (iPhone 15 Pro / iOS 17.2)
        id: resolve-sim
        shell: bash
        run: |
          set -e
          export V="$IOS_TARGET_VERSION"
          export DEV_NAME="$IOS_TARGET_DEVICE"

          python3 - <<'PY'
import json, os, subprocess, sys

def run_json(cmd):
    out = subprocess.check_output(cmd, text=True)
    return json.loads(out)

print("=== Resolving iOS runtime & device ===")

# 1) Pick an iOS runtime (prefer exact version V; never tvOS/watchOS)
runtimes = run_json(["xcrun","simctl","list","runtimes","--json"]).get("runtimes",[])
runtime_id = ""
for r in runtimes:
    if r.get("isAvailable") and r.get("platform")=="iOS" and r.get("version")==os.environ["V"]:
        runtime_id = r["identifier"]; break
if not runtime_id:
    ios = [r for r in runtimes if r.get("isAvailable") and r.get("platform")=="iOS"]
    if not ios:
        print("::error::No iOS runtime found", file=sys.stderr); sys.exit(1)
    ios.sort(key=lambda x: x.get("version","0"))
    runtime_id = ios[-1]["identifier"]
print(f"Using runtime: {runtime_id}")

# 2) Resolve device type (prefer exact name; else first iPhone)
devtypes = run_json(["xcrun","simctl","list","devicetypes","--json"]).get("devicetypes",[])
devtype_id = ""
for t in devtypes:
    if t.get("name")==os.environ["DEV_NAME"]:
        devtype_id = t["identifier"]; break
if not devtype_id:
    iphones = [t for t in devtypes if str(t.get("name","")).startswith("iPhone")]
    if not iphones:
        print("::error::No iPhone device type found", file=sys.stderr); sys.exit(1)
    devtype_id = iphones[0]["identifier"]
print(f"Using device type: {devtype_id}")

# 3) Find or create a simulator for (runtime_id, devtype_id)
devices_by_rt = run_json(["xcrun","simctl","list","devices","--json"]).get("devices",{})
udid = ""
name = ""
for rt, devs in devices_by_rt.items():
    if rt != runtime_id: continue
    for d in devs:
        if d.get("isAvailable"):
            name = d["name"]; udid = d["udid"]; break
    if udid: break

if not udid:
    name = f'CI {os.environ["DEV_NAME"]} ({os.environ["V"]})'
    udid = subprocess.check_output(["xcrun","simctl","create", name, devtype_id, runtime_id], text=True).strip()
    print(f"Created simulator: {name} ({udid})")
else:
    print(f"Reusing simulator: {name} ({udid})")

# Emit outputs for later steps
with open(os.environ["GITHUB_OUTPUT"], "a") as f:
    f.write(f"name={name}\n")
    f.write(f"udid={udid}\n")
    f.write(f"runtime={runtime_id}\n")
PY

      - name: Boot iOS Simulator (extended timeout)
        run: |
          set -e
          UDID="${{ steps.resolve-sim.outputs.udid }}"
          echo "Resetting and booting simulator $UDID"
          xcrun simctl shutdown all || true
          xcrun simctl erase "$UDID" || true
          xcrun simctl boot "$UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID"

          # Wait up to ~5 minutes for Booted state
          for i in $(seq 1 60); do
            STATE="$(xcrun simctl list devices | grep "$UDID" | sed -E 's/.*\((Booted|Shutdown)\).*/\1/' | tail -n1)"
            echo "[$i/60] Simulator state: ${STATE:-unknown}"
            [ "$STATE" = "Booted" ] && break
            sleep 5
          done
          sleep 10
        shell: bash

      - name: Start Appium server
        run: |
          set -e
          nohup appium --log-level info --session-override > appium-ios.log 2>&1 & echo $! > appium-ios.pid
          sleep 15
          curl -sf $APPIUM_URL/status || true
        shell: bash

      - name: Show iOS suite (sanity)
        run: |
          echo "Using suite: $IOS_SUITE_XML"
          sed -n '1,200p' "$IOS_SUITE_XML" || true
        shell: bash

      - name: Run iOS TestNG suite
        run: |
          set -e
          echo "Simulator: ${{ steps.resolve-sim.outputs.name }} (${{ steps.resolve-sim.outputs.udid }})"
          echo "Runtime:   ${{ steps.resolve-sim.outputs.runtime }}"
          echo "Using .app at: ${IOS_APP_PATH}"
          if [ ! -d "${IOS_APP_PATH}" ]; then
            echo "::error::.app not found at ${IOS_APP_PATH}"
            exit 1
          fi
          /usr/bin/find "${IOS_APP_PATH}" -maxdepth 2 -type f | sed -n '1,40p'

          mvn -B -ntp \
            -Dsurefire.suiteXmlFiles=${IOS_SUITE_XML} \
            -DREMOTE_URL=${APPIUM_URL} \
            "-Dios.device=${IOS_TARGET_DEVICE}" \
            "-Dios.platformVersion=${IOS_TARGET_VERSION}" \
            "-Dios.udid=${{ steps.resolve-sim.outputs.udid }}" \
            -Dios.app.path="${IOS_APP_PATH}" \
            -Dsurefire.useFile=false -Dsurefire.printSummary=true -Dsurefire.trimStackTrace=false \
            test
        shell: bash

      - name: Stop Appium
        if: always()
        run: |
          kill "$(cat appium-ios.pid)" 2>/dev/null || true
        shell: bash

      - name: Upload iOS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            test-output/
            appium-ios.log
          if-no-files-found: ignore