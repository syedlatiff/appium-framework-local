name: iOS UI Tests (Appium + Simulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      IOS_SUITE_XML: "testNGSuite/testng_ios.xml"                 # iOS-only TestNG suite
      APPIUM_URL: "http://127.0.0.1:4723/"
      IOS_APP_PATH: "src/test/java/org/latiffsyed/resources/UIKitCatalog.app"  # update if needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Appium + XCUITest driver
        run: |
          npm config set fund false
          npm config set audit false
          npm i -g appium@latest
          appium driver install xcuitest
          appium -v

      # Pick a real, available iPhone simulator and export its NAME + UDID
      - name: Pick a bootable iPhone Simulator
        id: pick-sim
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun","simctl","list","--json","devices","available"]))
          preferred = ["iPhone 16 Pro","iPhone 16","iPhone 15 Pro","iPhone 15","iPhone 14 Pro","iPhone 14"]
          found = None

          # Try preferred models first
          for want in preferred:
              for devs in data.get("devices", {}).values():
                  for d in devs:
                      if d.get("name")==want and d.get("isAvailable",True) and d.get("state") in ("Shutdown","Booted"):
                          found = d; break
                  if found: break
              if found: break

          # Otherwise, any available iPhone
          if not found:
              for devs in data.get("devices", {}).values():
                  for d in devs:
                      if str(d.get("name","")).startswith("iPhone") and d.get("isAvailable",True) and d.get("state") in ("Shutdown","Booted"):
                          found = d; break
                  if found: break

          if not found:
              print("::error::No suitable iPhone simulator found", file=sys.stderr)
              sys.exit(1)

          # Write outputs for later steps
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"name={found['name']}\n")
              f.write(f"udid={found['udid']}\n")
          print(f"Chosen simulator: {found['name']} ({found['udid']})")
          PY

      - name: Boot iOS Simulator
        run: |
          set -e
          UDID="${{ steps.pick-sim.outputs.udid }}"
          echo "Booting $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list | grep -A1 "Booted" || true

      - name: Start Appium server
        run: |
          nohup appium --log-level info > appium-ios.log 2>&1 & echo $! > appium-ios.pid
          sleep 10
          curl -sf $APPIUM_URL/status || true

      - name: Show iOS suite (sanity)
        run: |
          echo "Using suite: $IOS_SUITE_XML"
          sed -n '1,200p' "$IOS_SUITE_XML" || true

      - name: Run iOS TestNG suite
        run: |
          echo "Using .app at: ${IOS_APP_PATH}"
          if [ ! -d "${IOS_APP_PATH}" ]; then
            echo "::error::.app not found at ${IOS_APP_PATH}"; exit 1
          fi
          ls -ld "${IOS_APP_PATH}"

          mvn -B -ntp \
            -Dsurefire.suiteXmlFiles=${IOS_SUITE_XML} \
            -DREMOTE_URL=${APPIUM_URL} \
            "-Dios.device=${{ steps.pick-sim.outputs.name }}" \
            "-Dios.udid=${{ steps.pick-sim.outputs.udid }}" \
            -Dios.app.path="${IOS_APP_PATH}" \
            -Dsurefire.useFile=false -Dsurefire.printSummary=true -Dsurefire.trimStackTrace=false \
            test

      - name: Stop Appium
        if: always()
        run: |
          kill "$(cat appium-ios.pid)" 2>/dev/null || true

      - name: Upload iOS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            test-output/
            appium-ios.log
          if-no-files-found: ignore