name: iOS UI Tests (Appium + Simulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 60  # Increased from 45 for stability
    env:
      IOS_SUITE_XML: "testNGSuite/testng_ios.xml"
      APPIUM_URL: "http://127.0.0.1:4723/"
      IOS_APP_PATH: "src/test/java/org/latiffsyed/resources/UIKitCatalog.app"
      IOS_TARGET_VERSION: "17.5"
      IOS_TARGET_DEVICE: "iPhone 15 Pro"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Appium + XCUITest driver
        run: |
          set -e
          npm config set fund false
          npm config set audit false
          npm i -g appium@latest
          appium driver install xcuitest
          appium -v
        shell: bash

      - name: Resolve simulator (iPhone 15 Pro / iOS 17.5)
        id: resolve-sim
        run: |
          set -e
          V="$IOS_TARGET_VERSION"
          DEV_NAME="$IOS_TARGET_DEVICE"

          echo "Looking for iOS runtime $V …"
          RUNTIME_ID="$(xcrun simctl list runtimes --json | python3 - <<'PY'
          import json,sys,os
          target=os.environ["V"]
          data=json.load(sys.stdin)
          # Prefer an exact iOS-V match
          for r in data.get("runtimes",[]):
            if r.get("isAvailable") and r.get("platform")=="iOS" and r.get("version")==target:
              print(r["identifier"]); sys.exit(0)
          # Fallback: newest available iOS runtime
          cands=[r for r in data.get("runtimes",[]) if r.get("isAvailable") and r.get("platform")=="iOS"]
          if cands:
            # sort by version string, not perfect but good enough; newer are last
            cands=sorted(cands, key=lambda x: x.get("version","0"))
            print(cands[-1]["identifier"])
          PY
          )" || true

          if [ -z "$RUNTIME_ID" ]; then
            echo "::warning::No iOS runtime found at all"; exit 1
          fi
          echo "Using runtime: $RUNTIME_ID"

          echo "Resolving device type for: $DEV_NAME"
          DEV_TYPE_ID="$(xcrun simctl list devicetypes --json | python3 - <<'PY'
          import json,sys,os
          name=os.environ["DEV_NAME"]
          d=json.load(sys.stdin)
          for t in d.get("devicetypes",[]):
            if t.get("name")==name:
              print(t["identifier"]); sys.exit(0)
          print("")  # not found
          PY
          )" || true

          if [ -z "$DEV_TYPE_ID" ]; then
            echo "::warning::Device type '$DEV_NAME' not found; using the first iPhone device type available"
            DEV_TYPE_ID="$(xcrun simctl list devicetypes --json | python3 - <<'PY'
            import json,sys
            d=json.load(sys.stdin)
            for t in d.get("devicetypes",[]):
              if str(t.get("name","")).startswith("iPhone"):
                print(t["identifier"]); sys.exit(0)
            print("")
            PY
            )"
          fi

          if [ -z "$DEV_TYPE_ID" ]; then
            echo "::error::No iPhone device type found"
            exit 1
          fi

          # Try to find existing device matching DEV_TYPE_ID + RUNTIME_ID
          EXISTING="$(xcrun simctl list --json devices | python3 - <<'PY'
          import json,sys,os
          runtime=os.environ["RUNTIME_ID"]
          d=json.load(sys.stdin)
          for rtid,devs in d.get("devices",{}).items():
            if rtid!=runtime: continue
            for dev in devs:
              if dev.get("isAvailable"):
                print(dev["name"]+"|"+dev["udid"]); sys.exit(0)
          print("")
          PY
          )" || true

          if [ -n "$EXISTING" ]; then
            NAME="${EXISTING%%|*}"
            UDID="${EXISTING##*|}"
            echo "Reusing existing simulator: $NAME ($UDID)"
          else
            NAME="CI ${DEV_NAME} (${IOS_TARGET_VERSION})"
            echo "Creating simulator: $NAME"
            UDID="$(xcrun simctl create "$NAME" "$DEV_TYPE_ID" "$RUNTIME_ID")"
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME_ID" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Boot iOS Simulator (extended timeout)
        run: |
          set -e
          UDID="${{ steps.resolve-sim.outputs.udid }}"
          echo "Resetting and booting simulator $UDID"
          xcrun simctl shutdown all || true
          xcrun simctl erase "$UDID" || true
          xcrun simctl boot "$UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          
          # Extended timeout - 5 minutes instead of 2.5
          for i in $(seq 1 60); do
            STATE="$(xcrun simctl list devices | grep "$UDID" | sed -E 's/.*\((Booted|Shutdown)\).*/\1/' | tail -n1)"
            echo "[$i/60] Simulator state: ${STATE:-unknown}"
            [ "$STATE" = "Booted" ] && break
            sleep 5
          done
          
          # Extra wait for UI readiness
          sleep 10
        shell: bash

      - name: Start Appium server
        run: |
          set -e
          nohup appium --log-level info --session-override > appium-ios.log 2>&1 & echo $! > appium-ios.pid
          sleep 15  # Increased from 10 for better stability
          curl -sf $APPIUM_URL/status || true
        shell: bash

      - name: Show iOS suite (sanity)
        run: |
          echo "Using suite: $IOS_SUITE_XML"
          sed -n '1,200p' "$IOS_SUITE_XML" || true
        shell: bash

      - name: Run iOS TestNG suite
        run: |
          set -e
          echo "Simulator: ${{ steps.resolve-sim.outputs.name }} (${{ steps.resolve-sim.outputs.udid }})"
          echo "Runtime:   ${{ steps.resolve-sim.outputs.runtime }}"
          echo "Using .app at: ${IOS_APP_PATH}"
          if [ ! -d "${IOS_APP_PATH}" ]; then
            echo "::error::.app not found at ${IOS_APP_PATH}"
            exit 1
          fi
          /usr/bin/find "${IOS_APP_PATH}" -maxdepth 2 -type f | sed -n '1,40p'

          mvn -B -ntp \
            -Dsurefire.suiteXmlFiles=${IOS_SUITE_XML} \
            -DREMOTE_URL=${APPIUM_URL} \
            "-Dios.device=${IOS_TARGET_DEVICE}" \
            "-Dios.platformVersion=${IOS_TARGET_VERSION}" \
            "-Dios.udid=${{ steps.resolve-sim.outputs.udid }}" \
            -Dios.app.path="${IOS_APP_PATH}" \
            -Dsurefire.useFile=false -Dsurefire.printSummary=true -Dsurefire.trimStackTrace=false \
            test
        shell: bash

      - name: Stop Appium
        if: always()
        run: |
          kill "$(cat appium-ios.pid)" 2>/dev/null || true
        shell: bash

      - name: Upload iOS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            test-output/
            appium-ios.log
          if-no-files-found: ignore