name: iOS UI Tests (Appium + Simulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      IOS_SUITE_XML: "testNGSuite/testng_ios.xml"                  # iOS-only TestNG suite
      APPIUM_URL: "http://127.0.0.1:4723/"
      IOS_APP_PATH: "src/test/java/org/latiffsyed/resources/UIKitCatalog.app"  # update if needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Appium + XCUITest driver
        run: |
          set -e
          npm config set fund false
          npm config set audit false
          npm i -g appium@latest
          appium driver install xcuitest
          appium -v
        shell: bash

      - name: Pick a bootable iPhone Simulator
        id: pick-sim
        run: |
          set -e
          # Get list of available devices in JSON
          JSON="$(xcrun simctl list --json devices available)"
          # Prefer newer models first
          for MODEL in "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15" "iPhone 14 Pro" "iPhone 14"; do
            NAME="$(python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); 
for lst in d.get("devices",{}).values():
  for x in lst:
    if x.get("name")==sys.argv[1] and x.get("isAvailable",True) and x.get("state") in ("Shutdown","Booted"):
      print(x["name"]); sys.exit(0)
print("")' "$MODEL" <<<"$JSON")"
            if [ -n "$NAME" ]; then break; fi
          done
          if [ -z "$NAME" ]; then
            # Fallback: any available iPhone
            NAME="$(python3 -c 'import json,sys; d=json.loads(sys.stdin.read());
for lst in d.get("devices",{}).values():
  for x in lst:
    if str(x.get("name","")).startswith("iPhone") and x.get("isAvailable",True) and x.get("state") in ("Shutdown","Booted"):
      print(x["name"]); sys.exit(0)
print("")' <<<"$JSON")"
          fi
          if [ -z "$NAME" ]; then
            echo "::error::No suitable iPhone simulator found"
            exit 1
          fi
          # Resolve UDID for the chosen name
          UDID="$(python3 -c 'import json,sys; d=json.loads(sys.stdin.read());
nm=sys.argv[1]
for lst in d.get("devices",{}).values():
  for x in lst:
    if x.get("name")==nm and x.get("isAvailable",True) and x.get("state") in ("Shutdown","Booted"):
      print(x["udid"]); sys.exit(0)' "$NAME" <<<"$JSON")"
          echo "Chosen simulator: $NAME ($UDID)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Boot iOS Simulator (erase, launch UI, wait)
        run: |
          set -e
          UDID="${{ steps.pick-sim.outputs.udid }}"
          echo "Resetting and booting simulator $UDID"

          # Ensure no other sims are running and erase the chosen one to avoid stale state
          xcrun simctl shutdown all || true
          xcrun simctl erase "$UDID" || true

          # Boot and open the Simulator app pointing to this UDID
          xcrun simctl boot "$UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID"

          # Wait until the device reports Booted (extra polling for reliability)
          xcrun simctl bootstatus "$UDID" -b
          for i in $(seq 1 30); do
            STATE="$(xcrun simctl list devices | grep "$UDID" | sed -E 's/.*\((Booted|Shutdown)\).*/\1/' | tail -n1)"
            echo "Simulator state: ${STATE:-unknown}"
            [ "$STATE" = "Booted" ] && break
            sleep 5
          done
        shell: bash

      - name: Start Appium server
        run: |
          set -e
          nohup appium --log-level info > appium-ios.log 2>&1 & echo $! > appium-ios.pid
          sleep 10
          curl -sf $APPIUM_URL/status || true
        shell: bash

      - name: Show iOS suite (sanity)
        run: |
          echo "Using suite: $IOS_SUITE_XML"
          sed -n '1,200p' "$IOS_SUITE_XML" || true
        shell: bash

      - name: Run iOS TestNG suite
        run: |
          set -e
          echo "Chosen simulator: ${{ steps.pick-sim.outputs.name }} (${{ steps.pick-sim.outputs.udid }})"
          echo "Using .app at: ${IOS_APP_PATH}"
          if [ ! -d "${IOS_APP_PATH}" ]; then
            echo "::error::.app not found at ${IOS_APP_PATH}"
            exit 1
          fi
          /usr/bin/find "${IOS_APP_PATH}" -maxdepth 2 -type f | sed -n '1,40p'

          mvn -B -ntp \
            -Dsurefire.suiteXmlFiles=${IOS_SUITE_XML} \
            -DREMOTE_URL=${APPIUM_URL} \
            "-Dios.device=${{ steps.pick-sim.outputs.name }}" \
            "-Dios.udid=${{ steps.pick-sim.outputs.udid }}" \
            -Dios.app.path="${IOS_APP_PATH}" \
            -Dsurefire.useFile=false -Dsurefire.printSummary=true -Dsurefire.trimStackTrace=false \
            test
        shell: bash

      - name: Stop Appium
        if: always()
        run: |
          kill "$(cat appium-ios.pid)" 2>/dev/null || true
        shell: bash

      - name: Upload iOS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            test-output/
            appium-ios.log
          if-no-files-found: ignore