# .github/workflows/android-emulator-appium.yml
name: Android UI Tests (Appium + Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "30"
      TARGET: "google_apis"
      ARCH: "x86_64"
      PROFILE: "pixel_3a"
      SUITE_XML: "testNGSuite/testng_Smoke.xml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fix for "libpulse.so.0 not found" and other emulator deps
      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libglu1-mesa mesa-utils libnss3

      - name: Install Appium 3 + UiAutomator2 driver
        run: |
          npm i -g appium@next
          appium -v
          appium driver list --installed || true
          appium driver install uiautomator2
          appium driver list --installed

      - name: Start Android emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1200 # Increased timeout
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none -noaudio
          script: |
            # Wait for emulator to be fully ready
            echo "Waiting for emulator to be fully ready..."
            adb wait-for-device
            echo "Device detected, waiting for boot completion..."
            
            # Wait for boot completion with retries
            while true; do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$boot_completed" = "1" ]; then
                echo "Emulator is fully booted!"
                break
              fi
              echo "Waiting for boot completion..."
              sleep 10
            done
            
            # Additional wait to ensure stability
            sleep 15
            
            # Check device status
            adb devices -l
            adb shell getprop
            
            # Start Appium with better logging
            echo "Starting Appium server..."
            nohup appium --base-path /wd/hub --allow-cors --log-level info:info > appium.log 2>&1 &
            APPIUM_PID=$!
            
            # Wait for Appium to start
            sleep 15
            
            # Check if Appium is running
            if ps -p $APPIUM_PID > /dev/null; then
              echo "Appium server started successfully with PID: $APPIUM_PID"
            else
              echo "Appium server failed to start"
              cat appium.log
              exit 1
            fi
            
            # Run TestNG suite
            echo "Running tests..."
            mvn -B -ntp -Dtestng.suiteXmlFile="${SUITE_XML}" test
            
            # Stop Appium after tests
            kill $APPIUM_PID

      - name: Upload reports (Extent/TestNG) and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            reports/**
            test-output/**
            appium.log
            **/*.log