name: Android UI Tests (Appium + Pre-built Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE_XML: "testNGSuite/testng_Smoke.xml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium + UiAutomator2
        run: |
          npm config set fund false
          npm config set audit false
          npm i -g appium@latest
          appium driver install uiautomator2
          appium -v

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-pixel3a-google_apis

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Appium Tests with Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          disable-animations: true
          script: |
            # Start Appium (no /wd/hub) and save PID
            nohup appium --log-level info --relaxed-security --allow-insecure chromedriver_autodownload > appium.log 2>&1 & echo $! > appium.pid

            # Give Appium time to come up (simple & robust for this action)
            sleep 15

            # Sanity: list devices and Appium status
            adb devices || true
            curl -sf http://127.0.0.1:4723/status || true

            # Run your TestNG suite against the already running server (single line!)
            mvn -B -ntp -Dtestng.suiteXmlFile=${SUITE_XML} -DREMOTE_URL=http://127.0.0.1:4723/ -Dsurefire.useFile=false -Dsurefire.printSummary=true -Dsurefire.trimStackTrace=false test

            # Stop Appium
            kill "$(cat appium.pid)" 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            test-output/
            screenshots/
            appium.log
          if-no-files-found: ignore