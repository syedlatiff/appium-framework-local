# .github/workflows/android-emulator-appium.yml
name: Android UI Tests (Appium + Emulator - Manual)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "29"
      TARGET: "google_apis"
      ARCH: "x86"
      PROFILE: "pixel_3a"
      SUITE_XML: "testNGSuite/testng_Smoke.xml"
      AVD_NAME: "test_avd"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libglu1-mesa mesa-utils libnss3 \
            qemu-kvm virt-manager libvirt-daemon-system libvirt-clients bridge-utils

      - name: Install Appium 3 + UiAutomator2 driver
        run: |
          npm i -g appium@next
          appium driver install uiautomator2
          appium -v

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          cmdline-tools-version: "latest"
          build-tools-version: "30.0.3"
          platform-version: "android-${{ env.API_LEVEL }}"

      - name: Install system image and create AVD
        run: |
          # Install system image
          sdkmanager "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}"
          
          # Accept licenses
          yes | sdkmanager --licenses
          
          # Create AVD
          echo "no" | avdmanager create avd \
            --name ${{ env.AVD_NAME }} \
            --package "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}" \
            --device "pixel_3a" \
            --force
          
          # List AVDs to verify
          avdmanager list avd

      - name: Configure ADB and start emulator
        run: |
          # Set ADB to listen on all interfaces
          adb kill-server
          adb start-server
          adb devices
          
          # Get the path to emulator
          which emulator
          emulator -version

      - name: Start emulator with specific port and wait
        run: |
          # Start emulator with specific port and ADB connection
          emulator -avd ${{ env.AVD_NAME }} \
            -port 5558 \
            -no-window \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -noaudio \
            -verbose \
            -qemu -adb-name adb > emulator.log 2>&1 &
          
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV
          echo "Emulator started with PID: $EMULATOR_PID on port 5558"

      - name: Wait for emulator to boot
        run: |
          echo "Waiting for emulator to start..."
          sleep 30  # Give emulator time to initialize
          
          # Restart ADB to ensure clean connection
          adb kill-server
          sleep 5
          adb start-server
          sleep 5
          
          echo "Current ADB devices:"
          adb devices
          
          # Try to connect to the specific port
          adb connect 127.0.0.1:5558
          sleep 5
          
          echo "Devices after connect attempt:"
          adb devices
          
          # Wait for device with timeout
          echo "Waiting for device to be ready..."
          for i in {1..40}; do
            DEVICES=$(adb devices)
            if echo "$DEVICES" | grep -q "127.0.0.1:5558.*device"; then
              echo "Emulator connected and ready!"
              break
            fi
            echo "Attempt $i/40 - Device not ready yet. Current devices:"
            echo "$DEVICES"
            sleep 5
          done
          
          # Final connection check
          if adb devices | grep -q "127.0.0.1:5558.*device"; then
            echo "Emulator successfully connected!"
          else
            echo "Failed to connect to emulator"
            echo "Emulator log:"
            cat emulator.log
            exit 1
          fi

      - name: Wait for boot completion
        run: |
          echo "Waiting for boot completion..."
          # Wait for boot completion with timeout
          for i in {1..50}; do
            if adb -s 127.0.0.1:5558 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              echo "Emulator fully booted!"
              break
            fi
            
            # Alternative check
            if adb -s 127.0.0.1:5558 shell getprop dev.bootcomplete 2>/dev/null | grep -q "1"; then
              echo "Emulator boot complete detected!"
              break
            fi
            
            echo "Boot attempt $i/50 - waiting..."
            sleep 5
          done
          
          # Final boot check
          if adb -s 127.0.0.1:5558 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
            echo "Boot successful!"
            adb -s 127.0.0.1:5558 shell getprop
          else
            echo "Boot failed or timed out"
            exit 1
          fi

      - name: Start Appium server
        run: |
          echo "Starting Appium server..."
          nohup appium --base-path /wd/hub --allow-cors --log-level info:info > appium.log 2>&1 &
          APPIUM_PID=$!
          echo "APPIUM_PID=$APPIUM_PID" >> $GITHUB_ENV
          sleep 15
          
          # Verify Appium is running
          if ps -p $APPIUM_PID > /dev/null; then
            echo "Appium server started successfully with PID: $APPIUM_PID"
          else
            echo "Appium server failed to start"
            cat appium.log
            exit 1
          fi

      - name: Run tests
        run: |
          echo "Running TestNG tests..."
          # Set the device serial for tests if needed
          export ANDROID_DEVICE=127.0.0.1:5558
          mvn -B -ntp -Dtestng.suiteXmlFile="${{ env.SUITE_XML }}" test

      - name: Stop emulator and Appium
        if: always()
        run: |
          echo "Stopping emulator and Appium..."
          # Stop Appium
          if [ -n "$APPIUM_PID" ]; then
            kill $APPIUM_PID 2>/dev/null || true
          fi
          
          # Stop emulator
          adb -s 127.0.0.1:5558 emu kill || true
          if [ -n "$EMULATOR_PID" ]; then
            kill $EMULATOR_PID 2>/dev/null || true
          fi
          
          # Clean up
          pkill -f emulator || true
          pkill -f qemu || true

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            reports/**
            test-output/**
            appium.log
            emulator.log