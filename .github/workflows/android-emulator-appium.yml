name: Android UI Tests (Appium + Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AVD_NAME: ci-api30
      API_LEVEL: "30"
      # 👇 pick the suite you want to run
      SUITE_XML: "testNGSuite/testng_Smoke.xml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Appium v3 is required by the current uiautomator2 driver
      - name: Install Appium 3 + UiAutomator2 driver
        run: |
          npm i -g appium@next
          appium -v
          appium driver list --installed || true
          appium driver install uiautomator2
          appium driver list --installed

      # Install Android SDK using official action (adds sdkmanager/avdmanager/emulator to PATH)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages (API ${{ env.API_LEVEL }})
        run: |
          sdkmanager "platform-tools" "emulator" \
            "platforms;android-${API_LEVEL}" \
            "build-tools;30.0.3" \
            "system-images;android-${API_LEVEL};google_apis;x86_64"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};google_apis;x86_64" --device "pixel_3a"

      - name: Boot emulator (headless)
        run: |
          nohup emulator -avd "$AVD_NAME" \
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none > /dev/null 2>&1 &
          adb wait-for-device
          for i in {1..180}; do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = "1" ] && break
            sleep 2
          done
          adb shell input keyevent 82

      - name: Start Appium server
        run: |
          nohup appium --base-path /wd/hub --allow-cors --log-level info:info > appium.log 2>&1 &
          sleep 5

      - name: Build & run tests (Maven + TestNG)
        run: |
          mvn -B -ntp -Dtestng.suiteXmlFile="${SUITE_XML}" test

      - name: Upload reports (Extent/TestNG) and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            reports/**
            test-output/**
            appium.log