# .github/workflows/android-emulator-appium.yml
name: Android UI Tests (Appium + Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "30"
      TARGET: "google_apis"
      ARCH: "x86_64"
      PROFILE: "pixel_3a"
      SUITE_XML: "testNGSuite/testng_Smoke.xml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fix for "libpulse.so.0 not found" and other emulator deps
      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libglu1-mesa mesa-utils libnss3

      - name: Install Appium 3 + UiAutomator2 driver
        run: |
          npm i -g appium@next
          appium -v
          appium driver list --installed || true
          appium driver install uiautomator2
          appium driver list --installed

      - name: Start Android emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none -noaudio
          script: |
            adb devices -l
            # Start Appium
            nohup appium --base-path /wd/hub --allow-cors --log-level info:info > appium.log 2>&1 &
            sleep 8
            # Run TestNG suite
            mvn -B -ntp -Dtestng.suiteXmlFile="${SUITE_XML}" test

      - name: Upload reports (Extent/TestNG) and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            reports/**
            test-output/**
            appium.log