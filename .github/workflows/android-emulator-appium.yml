name: Android UI Tests (Appium + Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: "33"  # Changed from 29 to 33 for better compatibility
      TARGET: "google_apis_playstore"  # Changed to include Google Play Services
      ARCH: "x86_64"  # Changed to x86_64 for better performance
      PROFILE: "pixel_5"  # More modern device profile
      SUITE_XML: "testNGSuite/testng_Smoke.xml"
      AVD_NAME: "test_avd_ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libglu1-mesa mesa-utils libnss3 \
            net-tools qemu-kvm

      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2
          appium --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          build-tools-version: "33.0.0"
          ndk-version: "25.2.9519653"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install system image and create AVD
        run: |
          # Install system image and platform
          sdkmanager "platforms;android-${{ env.API_LEVEL }}"
          sdkmanager "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}"
          sdkmanager "platform-tools" "build-tools;33.0.0"
          
          # Create AVD with more memory
          echo "no" | avdmanager create avd \
            --name ${{ env.AVD_NAME }} \
            --package "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}" \
            --device "pixel_5" \
            --force

      - name: Start emulator with hardware acceleration
        run: |
          # Start emulator with hardware acceleration if available
          emulator -avd ${{ env.AVD_NAME }} \
            -no-window \
            -no-snapshot \
            -gpu auto \
            -no-boot-anim \
            -noaudio \
            -memory 4096 \
            -partition-size 2048 \
            -netfast \
            -accel on &
          
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV
          echo "Emulator started with PID: $EMULATOR_PID"

      - name: Wait for emulator to be ready
        run: |
          echo "Waiting for emulator to boot..."
          
          # Wait for emulator to appear
          for i in {1..20}; do
            if adb devices | grep -q "emulator"; then
              echo "✅ Emulator detected!"
              break
            fi
            echo "Waiting for emulator... ($i/20)"
            sleep 10
          done
          
          # Wait for boot completion with better checking
          adb wait-for-device
          for i in {1..15}; do
            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null || echo "0")
            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "✅ Emulator fully booted!"
              break
            fi
            echo "Waiting for boot completion... ($i/15)"
            sleep 5
          done
          
          # Additional wait for services to stabilize
          sleep 10
          
          # Unlock screen and dismiss setup
          adb shell input keyevent 82
          adb shell input keyevent 4
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Start Appium server
        run: |
          echo "Starting Appium server..."
          # Start Appium with specific host and port
          appium --host 127.0.0.1 --port 4723 --log-level info --relaxed-security &
          APPIUM_PID=$!
          echo "APPIUM_PID=$APPIUM_PID" >> $GITHUB_ENV
          sleep 15

      - name: Run tests with CI environment
        run: |
          echo "Running TestNG tests..."
          echo "Current devices:"
          adb devices -l
          echo "Device properties:"
          adb shell getprop | grep -E "(model|version|serial|boot)"
          
          # Run tests with CI flag and device property
          mvn -B -ntp -Dtestng.suiteXmlFile="${{ env.SUITE_XML }}" \
              -DRUN_ON_BS=false \
              -DandroidDevice=emulator-5554 \
              test

      - name: Stop services
        if: always()
        run: |
          echo "Stopping services..."
          adb emu kill || true
          pkill -f emulator || true
          pkill -f appium || true
          pkill -f adb || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            test-output/**
            **/reports/**
          if-no-files-found: warn