name: Android UI Tests (Appium + Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: "29"
      TARGET: "google_apis"
      ARCH: "x86"
      PROFILE: "pixel_3a"
      SUITE_XML: "testNGSuite/testng_Smoke.xml"
      AVD_NAME: "test_avd"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js (ignore lock file warning)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'  # Remove this line if you don't have package.json

      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libglu1-mesa mesa-utils libnss3 \
            net-tools

      - name: Install Appium globally
        run: |
          npm install -g appium
          npm install -g appium-uiautomator2-driver
          appium -v

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install system image and create AVD
        run: |
          sdkmanager "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}"
          echo "no" | avdmanager create avd \
            --name ${{ env.AVD_NAME }} \
            --package "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}" \
            --device "pixel_3a" \
            --force

      - name: Start emulator
        run: |
          emulator -avd ${{ env.AVD_NAME }} \
            -no-window \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -noaudio \
            -memory 2048 &
          echo "EMULATOR_PID=$!" >> $GITHUB_ENV

      - name: Wait for emulator to be ready
        run: |
          echo "Waiting for emulator to boot..."
          # Wait for emulator to appear
          for i in {1..30}; do
            if adb devices | grep -q "emulator"; then
              echo "✅ Emulator detected!"
              break
            fi
            echo "Waiting for emulator... ($i/30)"
            sleep 10
          done
          
          # Wait for boot completion
          adb wait-for-device
          for i in {1..30}; do
            if adb shell getprop sys.boot_completed | grep -q "1"; then
              echo "✅ Emulator fully booted!"
              break
            fi
            echo "Waiting for boot completion... ($i/30)"
            sleep 5
          done

      - name: Start Appium server
        run: |
          echo "Starting Appium server..."
          appium --log-level info --relaxed-security &
          echo "APPIUM_PID=$!" >> $GITHUB_ENV
          sleep 10

      - name: Run tests with retry
        run: |
          echo "Running TestNG tests..."
          echo "Current devices:"
          adb devices
          
          # Run tests with retry in case of temporary failures
          mvn -B -ntp -Dtestng.suiteXmlFile="${{ env.SUITE_XML }}" test || \
          mvn -B -ntp -Dtestng.suiteXmlFile="${{ env.SUITE_XML }}" test

      - name: Check if reports exist
        run: |
          echo "Checking for test reports..."
          ls -la target/ || echo "No target directory"
          ls -la target/surefire-reports/ || echo "No surefire-reports"
          ls -la test-output/ || echo "No test-output directory"

      - name: Upload test reports (if they exist)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            test-output/
          if-no-files-found: ignore  # Changed from 'warn' to 'ignore'

      - name: Stop services
        if: always()
        run: |
          adb emu kill || true
          pkill -f emulator || true
          pkill -f appium || true