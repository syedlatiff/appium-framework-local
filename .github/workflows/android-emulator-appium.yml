name: Android UI Tests (Appium + Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: $HOME/android-sdk
      ANDROID_HOME: $HOME/android-sdk
      AVD_NAME: ci-api30
      API_LEVEL: "30"
      # 👇 pick the suite you want to run
      SUITE_XML: "testNGSuite/testng_Smoke.xml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium 2 + UiAutomator2 driver
        run: |
          npm i -g appium@2 @appium/uiautomator2-driver
          appium driver install uiautomator2
          appium -v

      - name: Install Android SDK (cmdline-tools)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sLo sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q sdk.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install SDK packages (API ${{ env.API_LEVEL }})
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "platforms;android-${API_LEVEL}" \
            "build-tools;30.0.3" \
            "system-images;android-${API_LEVEL};google_apis;x86_64"

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};google_apis;x86_64" --device "pixel_3a"

      - name: Boot emulator (headless)
        run: |
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd "$AVD_NAME" \
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none > /dev/null 2>&1 &
          adb wait-for-device
          for i in {1..120}; do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = "1" ] && break
            sleep 2
          done
          adb shell input keyevent 82

      - name: Start Appium server
        run: |
          nohup appium --base-path /wd/hub --allow-cors --log-level info:info > appium.log 2>&1 &
          sleep 5

      - name: Build & run tests (Maven + TestNG)
        run: |
          mvn -B -ntp -Dtestng.suiteXmlFile="${SUITE_XML}" test

      - name: Upload reports (Extent/TestNG) and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            reports/**
            test-output/**
            appium.log
