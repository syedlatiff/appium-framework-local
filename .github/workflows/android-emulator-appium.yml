# .github/workflows/android-emulator-appium.yml
name: Android UI Tests (Appium + Emulator - Manual)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "29"
      TARGET: "google_apis"
      ARCH: "x86"
      PROFILE: "pixel_3a"
      SUITE_XML: "testNGSuite/testng_Smoke.xml"
      AVD_NAME: "test_avd"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libglu1-mesa mesa-utils libnss3 \
            net-tools iproute2

      - name: Install Appium 3 + UiAutomator2 driver
        run: |
          npm i -g appium@next
          appium driver install uiautomator2
          appium -v

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install system image and create AVD
        run: |
          # Install system image
          sdkmanager "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}"
          
          # Accept licenses
          yes | sdkmanager --licenses
          
          # Create AVD
          echo "no" | avdmanager create avd \
            --name ${{ env.AVD_NAME }} \
            --package "system-images;android-${{ env.API_LEVEL }};${{ env.TARGET }};${{ env.ARCH }}" \
            --device "pixel_3a" \
            --force

      - name: Configure ADB environment
        run: |
          # Set ADB to use TCP instead of USB
          export ADB_TRACE=all
          export ADB_LOCAL_TRANSPORT_MAX_PORT=5580
          
          # Kill any existing ADB servers
          adb kill-server
          pkill -f adb
          sleep 3
          
          # Start ADB server with specific parameters
          adb start-server
          echo "ADB server started"
          adb devices

      - name: Start emulator with explicit ADB connection
        run: |
          # Start emulator with explicit ADB server connection
          emulator -avd ${{ env.AVD_NAME }} \
            -port 5558 \
            -no-window \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -noaudio \
            -verbose \
            -qemu -tcpdump emulator.pcap \
            -adb-server tcp:5037 > emulator.log 2>&1 &
          
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV
          echo "Emulator started with PID: $EMULATOR_PID"

      - name: Wait and force ADB connection
        run: |
          echo "Waiting for emulator to initialize..."
          sleep 45
          
          # Force ADB server restart and connection
          adb kill-server
          sleep 5
          
          # Start ADB with specific parameters
          adb -a -P 5037 nodaemon server start &
          sleep 10
          
          # Force connect to emulator
          echo "Attempting to connect to emulator..."
          adb connect 127.0.0.1:5558
          
          # Check connection repeatedly
          for i in {1..20}; do
            echo "Connection attempt $i/20"
            DEVICES=$(adb devices)
            echo "Current devices:"
            echo "$DEVICES"
            
            if echo "$DEVICES" | grep -q "127.0.0.1:5558.*device"; then
              echo "✅ Emulator connected successfully!"
              break
            fi
            
            # Try reconnecting
            adb disconnect 127.0.0.1:5558
            adb connect 127.0.0.1:5558
            sleep 5
          done
          
          # Final check
          if adb devices | grep -q "127.0.0.1:5558.*device"; then
            echo "✅ Connection established!"
          else
            echo "❌ Failed to connect to emulator"
            echo "Network status:"
            netstat -tulpn || true
            echo "Emulator log excerpts:"
            tail -50 emulator.log
            exit 1
          fi

      - name: Wait for boot completion
        run: |
          echo "Waiting for emulator to boot..."
          for i in {1..30}; do
            if adb -s 127.0.0.1:5558 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              echo "✅ Emulator fully booted!"
              break
            fi
            echo "Boot attempt $i/30 - waiting..."
            sleep 5
          done
          
          adb -s 127.0.0.1:5558 shell getprop

      - name: Start Appium server
        run: |
          echo "Starting Appium server..."
          nohup appium --base-path /wd/hub --allow-cors --log-level info > appium.log 2>&1 &
          APPIUM_PID=$!
          echo "APPIUM_PID=$APPIUM_PID" >> $GITHUB_ENV
          sleep 15

      - name: Run tests
        run: |
          echo "Running TestNG tests..."
          mvn -B -ntp -Dtestng.suiteXmlFile="${{ env.SUITE_XML }}" test

      - name: Stop services
        if: always()
        run: |
          adb emu kill || true
          pkill -f emulator || true
          pkill -f adb || true

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            reports/**
            test-output/**
            appium.log
            emulator.log