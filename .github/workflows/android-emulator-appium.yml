name: Android UI Tests (Appium + Pre-built Emulator)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE_XML: "testNGSuite/testng_Smoke.xml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium globally
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2
          appium -v

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Appium Tests with Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          disable-animations: true
          script: |
            echo "Starting Appium server..."
            appium --log-level info --relaxed-security --allow-insecure chromedriver_autodownload &
            APPIUM_PID=$!
            
            # Wait for Appium to start
            echo "Waiting for Appium to be ready..."
            sleep 15
            
            # Verify devices and Appium
            echo "Checking ADB devices:"
            adb devices
            echo "Checking Appium status:"
            curl -s http://localhost:4723/wd/hub/status || echo "Appium status check failed"
            
            echo "Running TestNG tests..."
            # Run tests with retry
            for attempt in 1 2; do
              echo "Test attempt $attempt"
              if mvn -B -ntp -Dtestng.suiteXmlFile="${{ env.SUITE_XML }}" test; then
                echo "✅ Tests passed on attempt $attempt"
                break
              elif [ $attempt -eq 2 ]; then
                echo "❌ Tests failed after 2 attempts"
                exit 1
              else
                echo "⚠️  Test attempt $attempt failed, retrying in 30s..."
                sleep 30
              fi
            done
            
            # Stop Appium
            kill $APPIUM_PID || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            test-output/
            screenshots/
          if-no-files-found: ignore